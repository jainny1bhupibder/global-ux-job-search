name: Scheduled job discovery

# Eight runs a day, every three hours at minute 30 UTC. Keep in step with
# CRON_SCHEDULE in lib/runs.ts. GitHub may start a run a few minutes late.
on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the discovery endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          # 409 means this three-hour window already ran or a run is in progress: not a failure.
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 150 --retry 2 --retry-delay 20 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/daily")
          echo "HTTP $code"; cat response.json; echo
          case "$code" in 200|409) exit 0 ;; *) exit 1 ;; esac
